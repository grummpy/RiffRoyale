name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Core logic tests
        run: node --test tests/
      - name: Headless server smoke launch
        run: python3 tests/smoke_server.py
